<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração • Projeto Sentinela</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f5f9; --card:#fff; --texto:#1f2937; --suave:#6b7280; --borda:#e5e7eb;
    --side:#111827; --side2:#1f2937; --azul:#2563eb; --azul2:#1d4ed8;
    --verde:#16a34a; --amarelo:#eab308; --vermelho:#dc2626;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;transition:background .3s,color .3s;background:var(--bg);color:var(--texto)}
  button,input,select,textarea{font:inherit}
  .hidden{display:none!important}

  /* ---------- login ---------- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e3a8a)}
  .login-box{background:#fff;width:360px;max-width:92vw;padding:32px;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .login-box h1{margin:0 0 4px;font-size:22px}
  .login-box p{margin:0 0 18px;color:var(--suave);font-size:14px}
  .login-box input{width:100%;padding:12px;margin-top:10px;border:1px solid #cbd5e1;border-radius:8px}
  .login-box button{width:100%;margin-top:16px}
  .erro{color:var(--vermelho);font-size:14px;margin-top:10px;min-height:18px}

  /* ---------- layout ---------- */
  #app{display:flex;min-height:100vh}
  aside{width:230px;background:var(--side);color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
  aside .logo{padding:20px;font-weight:700;color:#fff;font-size:17px;border-bottom:1px solid var(--side2)}
  aside .logo small{display:block;font-weight:400;color:#94a3b8;font-size:12px;margin-top:2px}
  nav{flex:1;overflow-y:auto;padding:10px}
  nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px}
  nav button:hover{background:var(--side2);color:#fff}
  nav button.ativo{background:var(--azul);color:#fff}
  aside .rodape{padding:12px;border-top:1px solid var(--side2);font-size:13px}
  aside .rodape button{width:100%;margin-top:8px}
  main{flex:1;min-width:0;padding:24px 28px}
  .topo{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px}
  .topo h2{margin:0;font-size:22px}
  .acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #menuBtn{display:none}

  /* ---------- componentes ---------- */
  .btn{background:var(--azul);color:#fff;border:0;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:14px}
  .btn:hover{background:var(--azul2)}
  .btn.sec{background:#e5e7eb;color:var(--texto)}
  .btn.sec:hover{background:#d1d5db}
  .btn.perigo{background:var(--vermelho)}
  .btn.perigo:hover{background:#b91c1c}
  .btn.ok{background:var(--verde)}
  .btn.peq{padding:5px 10px;font-size:13px}
  .card{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:18px;margin-bottom:18px}
  .card h3{margin:0 0 12px;font-size:16px}
  .grid{display:grid;gap:16px}
  .g-stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .g-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .stat{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:16px}
  .stat .n{font-size:30px;font-weight:700}
  .stat .l{color:var(--suave);font-size:13px}
  input.busca{padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;min-width:220px}
  .tabela-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--borda);border-radius:12px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--borda);vertical-align:top}
  th{background:#f9fafb;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--suave);white-space:nowrap}
  tr:last-child td{border-bottom:0}
  td.acoes-td{white-space:nowrap}
  td.acoes-td button{margin-right:4px}
  .vazio{padding:30px;text-align:center;color:var(--suave)}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;background:#6b7280}
  .badge.verde{background:var(--verde)} .badge.amarelo{background:var(--amarelo);color:#111}
  .badge.vermelho{background:var(--vermelho)} .badge.admin{background:#7c3aed}
  .badge.off{background:#9ca3af}
  .barra-linha{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}
  .barra-linha .rot{width:110px;flex-shrink:0;color:var(--suave)}
  .barra{flex:1;background:#eef2f7;border-radius:6px;height:16px;overflow:hidden}
  .barra i{display:block;height:100%;background:var(--azul);border-radius:6px;min-width:2px}
  .barra i.verde{background:var(--verde)} .barra i.amarelo{background:var(--amarelo)} .barra i.vermelho{background:var(--vermelho)}
  .barra-linha .val{width:34px;text-align:right;font-weight:600}
  .dias{display:flex;align-items:flex-end;gap:8px;height:110px}
  .dias div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--suave)}
  .dias i{width:100%;background:var(--azul);border-radius:5px 5px 0 0;min-height:2px}
  .tv-atual{background:#0f172a;color:#fff;border-radius:12px;padding:18px;text-align:center}
  .tv-atual .p{font-size:26px;font-weight:700}
  .tv-atual .l{color:#93c5fd;margin-top:4px}
  .form-inline{display:flex;gap:8px;flex-wrap:wrap}
  .form-inline input,.form-inline select{padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px}
  .lista-simples div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--borda);font-size:14px}
  .lista-simples div:last-child{border-bottom:0}
  .aviso{background:#fef3c7;border:1px solid #fcd34d;color:#78350f;padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:16px}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal{background:#fff;border-radius:14px;width:480px;max-width:100%;max-height:92vh;overflow:auto;padding:22px}
  .modal h3{margin:0 0 14px}
  .modal label{display:block;font-size:13px;color:var(--suave);margin-top:12px}
  .modal input,.modal select,.modal textarea{width:100%;padding:10px;margin-top:4px;border:1px solid #cbd5e1;border-radius:8px}
  .modal textarea{min-height:80px;resize:vertical}
  .modal .rodape-modal{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
  #toast{position:fixed;right:18px;bottom:18px;z-index:99;display:flex;flex-direction:column;gap:8px}
  #toast div{background:#111827;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  #toast div.erro-t{background:var(--vermelho)}

  @media(max-width:820px){
    aside{position:fixed;left:-240px;z-index:40;transition:left .2s}
    aside.aberto{left:0}
    #menuBtn{display:inline-block}
    main{padding:16px}
  }

  /* ---------- animações e polimento ---------- */
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
  @keyframes slideT{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
  #conteudo>*{animation:fadeUp .4s both}
  #conteudo>*:nth-child(2){animation-delay:.05s}#conteudo>*:nth-child(3){animation-delay:.1s}
  .stat,.card{transition:transform .2s,box-shadow .2s}
  .stat:hover,.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px -14px rgba(15,23,42,.35)}
  .stat .n{background:linear-gradient(135deg,var(--azul),#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
  .modal{animation:pop .25s both}.overlay{animation:fadeUp .2s both;backdrop-filter:blur(4px)}
  #toast div{animation:slideT .3s both}
  tbody tr{transition:background .15s}tbody tr:hover{background:rgba(37,99,235,.06)}
  .btn{transition:transform .15s,filter .15s,background .2s}.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
  nav button{transition:background .2s,transform .2s}nav button:hover{transform:translateX(3px)}
  .nbadge{margin-left:auto;background:var(--vermelho);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
  .vivo{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--verde);font-weight:600}
  .vivo i{width:8px;height:8px;border-radius:50%;background:var(--verde);animation:pulseDot 1.4s infinite}
  .rowfila{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--borda);animation:fadeUp .3s both}
  .rowfila:last-child{border-bottom:0}
  .cmdk{width:520px;max-width:100%;background:var(--card);border-radius:14px;overflow:hidden;animation:pop .2s both;box-shadow:0 30px 60px rgba(0,0,0,.4)}
  .cmdk input{width:100%;border:0;border-bottom:1px solid var(--borda);padding:16px;font-size:16px;outline:0;background:transparent;color:var(--texto)}
  .cmdk div.it{padding:11px 16px;cursor:pointer;display:flex;gap:10px;font-size:14px}
  .cmdk div.it.sel,.cmdk div.it:hover{background:var(--azul);color:#fff}
  kbd{background:rgba(127,127,127,.18);border-radius:5px;padding:1px 6px;font-size:12px}

  /* ---------- tema escuro ---------- */
  [data-tema="escuro"]{--bg:#0b1220;--card:#111a2e;--texto:#e5e7eb;--suave:#94a3b8;--borda:#1f2a44;--side:#070c18;--side2:#131d33}
  [data-tema="escuro"] th{background:#0e1627}
  [data-tema="escuro"] .modal,[data-tema="escuro"] .login-box{background:var(--card);color:var(--texto)}
  [data-tema="escuro"] input,[data-tema="escuro"] select,[data-tema="escuro"] textarea{background:#0e1627;color:var(--texto);border-color:var(--borda)!important}
  [data-tema="escuro"] .btn.sec{background:#1f2a44;color:var(--texto)}
  [data-tema="escuro"] .barra{background:#1f2a44}
  [data-tema="escuro"] .aviso{background:#3b2f0b;border-color:#92710f;color:#fde68a}

  /* ---------- visual extra ---------- */
  aside{background:linear-gradient(180deg,#0b1224 0%,#111c3a 100%)}
  nav button{position:relative;border-radius:10px}
  nav button.ativo{background:linear-gradient(135deg,#2563eb,#06b6d4);box-shadow:0 8px 20px -8px rgba(37,99,235,.8)}
  nav button.ativo::before{content:"";position:absolute;left:-10px;top:20%;height:60%;width:4px;border-radius:4px;background:#67e8f9}
  .login-box{border:1px solid rgba(255,255,255,.2)}
  #login{background:radial-gradient(circle at 20% 20%,#2563eb55,transparent 40%),radial-gradient(circle at 80% 80%,#06b6d455,transparent 40%),linear-gradient(135deg,#0b1224,#1e3a8a)}
  .topo h2{font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,var(--texto),var(--azul));-webkit-background-clip:text;background-clip:text;color:transparent}
  tbody tr:nth-child(even){background:rgba(127,127,127,.04)}
  .tabela-wrap,.card,.stat{box-shadow:0 1px 2px rgba(15,23,42,.04)}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#94a3b855;border-radius:9px}
  .badge.azul{background:var(--azul)}.badge.roxo{background:#7c3aed}
  .hero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;color:#fff;border-radius:16px;padding:22px 26px;margin-bottom:18px;background:linear-gradient(120deg,#1d4ed8,#0891b2,#7c3aed);background-size:200% 200%;animation:fadeUp .4s both,grad 10s ease infinite}
  .hero h3{margin:0;font-size:22px}.hero p{margin:4px 0 0;opacity:.85;font-size:14px}
  .hero .btn{background:rgba(255,255,255,.18);backdrop-filter:blur(6px)}.hero .btn:hover{background:rgba(255,255,255,.3)}
  @keyframes grad{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
  .leitos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .leito{position:relative;border-radius:14px;padding:14px;color:#fff;cursor:pointer;min-height:104px;animation:pop .3s both;transition:transform .2s,box-shadow .2s}
  .leito:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 26px -12px rgba(0,0,0,.5)}
  .leito b{font-size:22px;display:block}.leito small{opacity:.9;display:block}
  .leito .st{position:absolute;right:10px;top:10px;font-size:11px;font-weight:700;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:999px}
  .leito .del{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.25);border:0;color:#fff;border-radius:8px;cursor:pointer;opacity:0;transition:.2s}
  .leito:hover .del{opacity:1}
  .leito.livre{background:linear-gradient(135deg,#22c55e,#15803d)}.leito.ocupado{background:linear-gradient(135deg,#ef4444,#b91c1c)}
  .leito.limpeza{background:linear-gradient(135deg,#f59e0b,#d97706)}.leito.manutencao{background:linear-gradient(135deg,#64748b,#334155)}
  .fin{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
  .fin .stat .n{font-size:24px}.pos{color:var(--verde);font-weight:700}.neg{color:var(--vermelho);font-weight:700}
  @media print{aside,.acoes,#menuBtn,#toast{display:none!important}main{padding:0}body{background:#fff}.card,.stat{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <div class="login-box">
    <h1>🛡️ Administração</h1>
    <p>Acesso restrito a administradores do sistema.</p>
    <input id="lUsuario" placeholder="Usuário" autocomplete="username">
    <input id="lSenha" type="password" placeholder="Senha" autocomplete="current-password">
    <div class="erro" id="lErro"></div>
    <button class="btn" id="lBtn">Entrar</button>
    <p style="margin-top:14px;font-size:12px"><a href="/index.html">← Voltar ao sistema</a></p>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="logo">🛡️ <span id="nomeSistema">Sentinela</span><small>Painel administrativo</small></div>
    <nav id="nav"></nav>
    <div class="rodape">
      Logado como <b id="quem"></b>
      <button class="btn sec peq" id="temaBtn">🌙 Tema escuro</button>
      <button class="btn sec peq" onclick="abrirPaleta()">🔎 Busca rápida <kbd>Ctrl K</kbd></button>
      <button class="btn sec peq" onclick="location.href='/index.html'">← Sistema</button>
      <button class="btn perigo peq" onclick="sair()">Sair</button>
    </div>
  </aside>

  <main>
    <div class="topo">
      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn sec" id="menuBtn" onclick="document.getElementById('side').classList.toggle('aberto')">☰</button>
        <h2 id="titulo"></h2>
      </div>
      <div class="acoes" id="acoesTopo"></div>
    </div>
    <div id="conteudo"></div>
  </main>
</div>

<div id="toast"></div>

<script>
// ============================================================
//  UTILIDADES
// ============================================================
const API = "/admin-api";
let token = sessionStorage.getItem("adm_token");
let usuarioLogado = sessionStorage.getItem("adm_user");

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const dt = (v) => (v ? new Date(v).toLocaleString("pt-BR") : "—");

function toast(msg, erro) {
  const d = document.createElement("div");
  if (erro) d.className = "erro-t";
  d.textContent = msg;
  $("toast").appendChild(d);
  setTimeout(() => d.remove(), 3800);
}

async function api(caminho, opcoes = {}) {
  const r = await fetch(API + caminho, {
    method: opcoes.method || "GET",
    headers: { "Content-Type": "application/json", "x-admin-token": token || "" },
    body: opcoes.body !== undefined ? JSON.stringify(opcoes.body) : undefined
  });
  if (r.status === 401 && caminho !== "/login") {
    sair(true);
    throw new Error("Sessão expirada. Entre novamente.");
  }
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(dados.erro || "Erro na requisição");
  return dados;
}

// executa uma ação mostrando erro em toast
async function tentar(fn, sucesso) {
  try {
    const r = await fn();
    if (sucesso) toast(sucesso);
    return r;
  } catch (e) {
    toast(e.message, true);
    return null;
  }
}

// ---------- modal ----------
function abrirModal(html, aoMontar) {
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="modal">${html}</div>`;
  ov.addEventListener("mousedown", (e) => { if (e.target === ov) ov.remove(); });
  document.body.appendChild(ov);
  if (aoMontar) aoMontar(ov);
  return ov;
}

function confirmar(titulo, texto, rotulo = "Confirmar", perigo = true) {
  return new Promise((resolve) => {
    const ov = abrirModal(`
      <h3>${esc(titulo)}</h3><p>${esc(texto)}</p>
      <div class="rodape-modal">
        <button class="btn sec" data-r="0">Cancelar</button>
        <button class="btn ${perigo ? "perigo" : ""}" data-r="1">${esc(rotulo)}</button>
      </div>`);
    ov.querySelectorAll("button").forEach((b) => b.onclick = () => { ov.remove(); resolve(b.dataset.r === "1"); });
  });
}

// pede que o usuário digite uma palavra para liberar ações destrutivas
function confirmarDigitando(titulo, texto, palavra) {
  return new Promise((resolve) => {
    const ov = abrirModal(`
      <h3>${esc(titulo)}</h3><p>${esc(texto)}</p>
      <label>Digite <b>${esc(palavra)}</b> para confirmar</label>
      <input id="mConf" autocomplete="off">
      <div class="rodape-modal">
        <button class="btn sec" data-r="0">Cancelar</button>
        <button class="btn perigo" data-r="1">Confirmar</button>
      </div>`);
    ov.querySelectorAll("button").forEach((b) => b.onclick = () => {
      if (b.dataset.r === "1" && ov.querySelector("#mConf").value !== palavra) {
        return toast("Texto de confirmação incorreto", true);
      }
      ov.remove();
      resolve(b.dataset.r === "1");
    });
  });
}

// formulário genérico (criar/editar)
function formulario(titulo, campos, valores, aoSalvar) {
  const html = campos.map((c) => {
    const v = valores[c.k] ?? c.padrao ?? "";
    let input;
    if (c.t === "select") {
      input = `<select name="${c.k}">${c.o.map((o) => {
        const val = Array.isArray(o) ? o[0] : o, rot = Array.isArray(o) ? o[1] : o;
        return `<option value="${esc(val)}" ${String(v) === String(val) ? "selected" : ""}>${esc(rot)}</option>`;
      }).join("")}</select>`;
    } else if (c.t === "textarea") {
      input = `<textarea name="${c.k}">${esc(v)}</textarea>`;
    } else {
      input = `<input name="${c.k}" type="${c.t || "text"}" value="${c.t === "password" ? "" : esc(v)}" placeholder="${esc(c.ph || "")}" ${c.step ? `step="${c.step}"` : ""}>`;
    }
    return `<label>${esc(c.l)}${input}</label>`;
  }).join("");

  abrirModal(`<h3>${esc(titulo)}</h3><form id="fm">${html}
    <div class="rodape-modal">
      <button type="button" class="btn sec" id="fmCancel">Cancelar</button>
      <button type="submit" class="btn">Salvar</button>
    </div></form>`, (ov) => {
    ov.querySelector("#fmCancel").onclick = () => ov.remove();
    ov.querySelector("#fm").onsubmit = async (e) => {
      e.preventDefault();
      const dados = {};
      new FormData(e.target).forEach((val, k) => dados[k] = val);
      const ok = await aoSalvar(dados);
      if (ok) ov.remove();
    };
    const primeiro = ov.querySelector("input,select,textarea");
    if (primeiro) primeiro.focus();
  });
}

function baixarArquivo(nome, conteudo, tipo) {
  const blob = new Blob([conteudo], { type: tipo });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ============================================================
//  LOGIN / SESSÃO
// ============================================================
async function entrar() {
  $("lErro").textContent = "";
  try {
    const r = await api("/login", { method: "POST", body: { usuario: $("lUsuario").value, senha: $("lSenha").value } });
    token = r.token; usuarioLogado = r.usuario;
    sessionStorage.setItem("adm_token", token);
    sessionStorage.setItem("adm_user", usuarioLogado);
    iniciar();

function barras(obj, classes = {}) {
  const itens = Object.entries(obj);
  if (!itens.length) return `<div class="vazio">Sem dados</div>`;
  const max = Math.max(...itens.map(([, v]) => v), 1);
  return itens.map(([k, v]) => `
    <div class="barra-linha"><span class="rot">${esc(k)}</span>
      <div class="barra"><i class="${classes[k] || ""}" style="width:${(v / max) * 100}%"></i></div>
      <span class="val">${v}</span></div>`).join("");
}

function colunasDias(arr) {
  const max = Math.max(...arr.map((x) => x.total), 1);
  return `<div class="dias">${arr.map((x) => `
    <div title="${x.total}"><span>${x.total}</span><i style="height:${(x.total / max) * 80}px"></i><span>${x.dia.slice(8)}/${x.dia.slice(5, 7)}</span></div>`).join("")}</div>`;
}

function situacaoItem(i) {
  const hoje = new Date().toISOString().slice(0, 10);
  const limite = new Date(Date.now() + 30 * 86400000).toISOString().slice(0, 10);
  if (i.validade && i.validade < hoje) return "vencido";
  if ((i.estoque || 0) <= 0) return "sem_estoque";
  if (i.minimo > 0 && i.estoque <= i.minimo) return "baixo";
  if (i.validade && i.validade <= limite) return "vence_breve";
  return "ok";
}

      { k: "senha", l: "Senha", t: "password", ph: "mín. 4 caracteres" },
      { k: "tipo", l: "Perfil", t: "select", o: ["atendimento", "triagem", "medico", "farmacia", "admin"] },
      { k: "ativo", l: "Situação", t: "select", o: [["true", "Ativo"], ["false", "Inativo"]], padrao: "true" }
    ],
    singular: "usuário"
  }
};

// valores exibidos em texto puro (busca e CSV)
function valorTexto(c, item) {
  const v = item[c[0]];
  if (c[0] === "createdAt") return dt(v);
  if (c[0] === "ativo") return v === false ? "inativo" : "ativo";
  if (c[0] === "_sit") return SIT[v] ? SIT[v][1] : "";
  if (c[0] === "validade") return dataBR(v);
  return v ?? "";
}

async function telaColecao(col) {
  const cfg = COLECOES[col];
  const enr = cfg.enriquecer || ((x) => x);
  let dados = enr(await api(`/colecao/${col}`));
  let termo = "";

  const desenhar = () => {
    const filtrados = dados.filter((it) =>
      !termo || cfg.colunas.some((c) => String(valorTexto(c, it)).toLowerCase().includes(termo)));

    const linhas = filtrados.map((it) => `<tr>
      ${cfg.colunas.map((c) => `<td>${c[2] && c[0] !== "createdAt" ? c[2](it[c[0]], it) : esc(valorTexto(c, it))}</td>`).join("")}
      ${cfg.somenteLeitura ? "" : `<td class="acoes-td">
        ${(cfg.acoesExtra || []).map((a) => `<button class="btn ok peq" data-a="${a.id}" data-id="${it.id}">${a.rot}</button>`).join("")}
        <button class="btn sec peq" data-a="editar" data-id="${it.id}">✏️ Editar</button>
        <button class="btn perigo peq" data-a="excluir" data-id="${it.id}">🗑️</button>
      </td>`}</tr>`).join("");

    $("lista").innerHTML = filtrados.length
      ? `<table><thead><tr>${cfg.colunas.map((c) => `<th>${c[1]}</th>`).join("")}${cfg.somenteLeitura ? "" : "<th></th>"}</tr></thead><tbody>${linhas}</tbody></table>`
      : `<div class="vazio">Nenhum registro encontrado.</div>`;
    $("topoCol").innerHTML = cfg.topo ? cfg.topo(dados) : "";
    $("contagem").textContent = `${filtrados.length} de ${dados.length} registro(s)`;

    $("lista").querySelectorAll("button").forEach((b) => b.onclick = () => {
      const item = dados.find((x) => String(x.id) === b.dataset.id);
      if (b.dataset.a === "editar") editar(item);
      else if (b.dataset.a === "excluir") excluir(item);
      else { const ex = (cfg.acoesExtra || []).find((a) => a.id === b.dataset.a); if (ex) ex.fn(item, recarregar); }
    });
  };

  const recarregar = async () => { dados = enr(await api(`/colecao/${col}`)); desenhar(); };

  const preparar = (d) => {
    const saida = { ...d };
    if ("ativo" in saida) saida.ativo = saida.ativo === "true";
    if ((col === "usuarios" || col === "contas") && !saida.senha) delete saida.senha;
    return saida;
  };

  const abrirForm = (item) => {
    const novo = !item;
    let campos = cfg.campos.filter((c) => !(c.soNovo && item));
    if (col === "usuarios" && !novo) {
      campos = campos.map((c) => c.k === "senha" ? { ...c, l: "Nova senha (deixe vazio para manter)" } : c);
    }
    const valores = novo ? {} : { ...item, ativo: String(item.ativo !== false) };
    formulario(novo ? `Novo(a) ${cfg.singular}` : `Editar ${cfg.singular}`, campos, valores, async (d) => {
      const r = await tentar(
        () => api(novo ? `/colecao/${col}` : `/colecao/${col}/${item.id}`, { method: novo ? "POST" : "PUT", body: preparar(d) }),
        novo ? "Registro criado" : "Registro atualizado");
      if (r) { await recarregar(); return true; }
      return false;
    });
  };
  const editar = (item) => abrirForm(item);

  const excluir = async (item) => {
    if (!(await confirmar("Excluir registro", `Tem certeza que deseja excluir este(a) ${cfg.singular}? Esta ação não pode ser desfeita.`, "Excluir"))) return;
    if (await tentar(() => api(`/colecao/${col}/${item.id}`, { method: "DELETE" }), "Registro excluído")) recarregar();
  };

  $("conteudo").innerHTML = `
    ${cfg.info ? `<div class="aviso" style="background:#dbeafe;border-color:#93c5fd;color:#1e3a8a">${esc(cfg.info)}</div>` : ""}
    <div id="topoCol"></div>
    <div class="tabela-wrap" id="lista"></div>
    <p style="color:var(--suave);font-size:13px" id="contagem"></p>`;

  $("acoesTopo").innerHTML = `
    <input class="busca" id="busca" placeholder="🔎 Buscar…">
    ${cfg.semNovo ? "" : `<button class="btn" id="bNovo">${cfg.novoRotulo || "＋ Novo"}</button>`}
    <button class="btn sec" id="bCsv">⬇ CSV</button>
    ${col !== "usuarios" ? `<button class="btn perigo" id="bLimpar">Apagar todos</button>` : ""}`;

  $("busca").oninput = (e) => { termo = e.target.value.toLowerCase(); desenhar(); };
  if ($("bNovo")) $("bNovo").onclick = () => (cfg.novoCustom ? cfg.novoCustom(recarregar) : abrirForm(null));
  $("bCsv").onclick = () => {
    const cab = cfg.colunas.map((c) => c[1]);
    const lin = dados.map((it) => cfg.colunas.map((c) => `"${String(valorTexto(c, it)).replace(/"/g, '""')}"`).join(";"));
    baixarArquivo(`${col}.csv`, "\ufeff" + [cab.join(";"), ...lin].join("\n"), "text/csv;charset=utf-8");
  };
  if ($("bLimpar")) $("bLimpar").onclick = async () => {
    if (!(await confirmarDigitando("Apagar todos os registros", `Isso remove TODOS os registros de "${MENU.find((m) => m[0] === col)[2]}".`, "CONFIRMAR"))) return;
    if (await tentar(() => api(`/colecao/${col}/limpar`, { method: "POST", body: { confirmar: "CONFIRMAR" } }), "Registros apagados")) recarregar();
  };
  desenhar();
}

async function abrirMovimento(itemPre, aposSalvar) {
  const itens = await tentar(() => api("/colecao/almox_itens"));
  if (!itens) return;
  if (!itens.length) return toast("Cadastre um item antes de movimentar o estoque", true);
  const ord = [...itens].sort((a, b) => a.nome.localeCompare(b.nome));

  formulario("Movimentar estoque", [
    { k: "itemId", l: "Item", t: "select", o: ord.map((i) => [i.id, `${i.nome} (saldo: ${i.estoque} ${i.unidade})`]) },
    { k: "tipo", l: "Tipo de movimentação", t: "select", o: [["entrada", "Entrada (compra / recebimento)"], ["saida", "Saída (consumo / uso)"], ["ajuste", "Ajuste (definir o saldo contado)"]] },
    { k: "quantidade", l: "Quantidade (no ajuste: novo saldo total)", t: "number", step: "any" },
    { k: "motivo", l: "Motivo / destino / nota fiscal" }
  ], { itemId: itemPre ? itemPre.id : ord[0].id, tipo: "entrada" }, async (d) => {
    if (d.quantidade === "") { toast("Informe a quantidade", true); return false; }
    const r = await tentar(() => api("/almox/movimentar", { method: "POST", body: d }), "Movimentação registrada");
    if (!r) return false;
    if (aposSalvar) await aposSalvar();
    return true;
  });
}

const PESO_RISCO = { vermelho: 0, amarelo: 1, verde: 2 };
const minutosDesde = (iso) => (iso ? Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000)) : 0);
const tempoTxt = (m) => (m < 60 ? `${m} min` : `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}`);

      const num = prompt(`Número do ${b.dataset.tipo.toLowerCase()} para chamar ${b.dataset.chamar}:`, "01");
      if (num === null) return;
      if (await tentar(() => api("/tv/chamar", { method: "POST", body: { paciente: b.dataset.chamar, localTipo: b.dataset.tipo, localNumero: num } }), "Paciente chamado na TV")) render();
    });
  };
  await render();
  $("acoesTopo").innerHTML = `<span class="vivo"><i></i>atualiza a cada 10 s</span><button class="btn sec" onclick="ir('live')">🔄</button>`;
  timerAuto = setInterval(() => { if (!document.querySelector(".overlay")) render().catch(() => {}); }, 10000);
}

async function telaRelatorios() {
  const [pac, tri, con, mov] = await Promise.all([api("/colecao/pacientes"), api("/colecao/triagens"), api("/colecao/consultas"), api("/colecao/almox_movimentos")]);
  let periodo = 30;

  const contar = (arr, fn) => arr.reduce((a, x) => { const k = fn(x) || "—"; a[k] = (a[k] || 0) + 1; return a; }, {});
  const top = (obj, n = 6) => Object.fromEntries(Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, n));

  const desenhar = () => {
    const corte = periodo ? Date.now() - periodo * 86400000 : 0;
    const no = (x) => !corte || new Date(x.createdAt).getTime() >= corte;
    const P = pac.filter(no), T = tri.filter(no), C = con.filter(no), M = mov.filter(no);
    const dias = [];
    for (let i = Math.min(periodo || 30, 30) - 1; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); dias.push(d.toISOString().slice(0, 10)); }
    const serie = dias.map((dia) => ({ dia, total: P.filter((x) => (x.createdAt || "").slice(0, 10) === dia).length }));
    const saidas = M.filter((m) => m.tipo === "saida").reduce((s, m) => s + m.quantidade, 0);
    const stat = (n, l) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`;

    $("rel").innerHTML = `
      <div class="grid g-stats" style="margin-bottom:18px">
        ${stat(P.length, "Pacientes")}${stat(T.length, "Triagens")}${stat(C.length, "Consultas")}
        ${stat(T.filter((t) => t.risco === "vermelho").length, "Casos vermelhos")}${stat(saidas, "Itens consumidos (almox.)")}
      </div>
      <div class="grid g-2">
        <div class="card"><h3>Pacientes por dia ${periodo > 30 || !periodo ? "(últimos 30 dias)" : ""}</h3>${colunasDias(serie)}</div>
        <div class="card"><h3>Classificação de risco</h3>${barras(contar(T, (t) => t.risco), { verde: "verde", amarelo: "amarelo", vermelho: "vermelho" })}</div>
        <div class="card"><h3>Tipo de atendimento</h3>${barras(contar(P, (p) => p.tipo))}</div>
        <div class="card"><h3>Diagnósticos mais comuns</h3>${barras(top(contar(C, (c) => (c.diagnostico || "").trim())))}</div>
        <div class="card"><h3>Medicações mais prescritas</h3>${barras(top(contar(C, (c) => c.medicacao)))}</div>
        <div class="card"><h3>Itens mais consumidos no almoxarifado</h3>${barras(top(M.filter((m) => m.tipo === "saida").reduce((a, m) => { a[m.itemNome] = (a[m.itemNome] || 0) + m.quantidade; return a; }, {})))}</div>
      </div>`;
  };

  $("conteudo").innerHTML = `<div id="rel"></div>`;
  $("acoesTopo").innerHTML = `
    <select id="rPer" class="busca"><option value="7">Últimos 7 dias</option><option value="30" selected>Últimos 30 dias</option><option value="90">Últimos 90 dias</option><option value="0">Todo o período</option></select>
    <button class="btn" onclick="window.print()">🖨️ Imprimir / PDF</button>`;
  $("rPer").onchange = (e) => { periodo = Number(e.target.value); desenhar(); };
  desenhar();
}

function aplicarTema(t) {
  document.documentElement.dataset.tema = t;
  try { localStorage.setItem("adm_tema", t); } catch (_) {}
  const b = $("temaBtn"); if (b) b.textContent = t === "escuro" ? "☀️ Tema claro" : "🌙 Tema escuro";
}
let temaSalvo = "claro";
try { temaSalvo = localStorage.getItem("adm_tema") || "claro"; } catch (_) {}
aplicarTema(temaSalvo);
$("temaBtn").onclick = () => aplicarTema(document.documentElement.dataset.tema === "escuro" ? "claro" : "escuro");

// contadores sobem de 0 até o valor quando aparecem
new MutationObserver(() => {
  document.querySelectorAll("#conteudo .stat .n:not([data-ok])").forEach((el) => {
    el.dataset.ok = 1;
    const alvo = el.textContent.trim();
    if (!/^\d+$/.test(alvo)) return;
    const fim = Number(alvo), t0 = performance.now();
    const passo = (t) => {
      const k = Math.min(1, (t - t0) / 700);
      el.textContent = Math.round(fim * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(passo);
    };
    requestAnimationFrame(passo);
  });
}).observe($("conteudo"), { childList: true, subtree: true });

function abrirPaleta() {
  const acoes = [
    ...MENU.map(([id, ic, nome]) => ({ rot: `${ic} Ir para ${nome.replace("• ", "")}`, fn: () => ir(id) })),
    { rot: "🔁 Nova movimentação de estoque", fn: () => abrirMovimento(null, () => telaAtual.startsWith("almox") && ir(telaAtual)) },
    { rot: "🌓 Alternar tema", fn: () => $("temaBtn").click() },
    { rot: "🚪 Sair", fn: () => sair() }
  ];
  let filtro = acoes, sel = 0;
  const ov = abrirModal(`<input id="cmdIn" placeholder="Digite para buscar uma tela ou ação…" autocomplete="off"><div id="cmdLista"></div>`);
  const box = ov.firstElementChild; box.className = "cmdk";
  const lista = ov.querySelector("#cmdLista"), inp = ov.querySelector("#cmdIn");
  const pintar = () => {
    lista.innerHTML = filtro.slice(0, 9).map((a, i) => `<div class="it ${i === sel ? "sel" : ""}" data-i="${i}">${esc(a.rot)}</div>`).join("") || `<div class="it">Nada encontrado</div>`;
    lista.querySelectorAll(".it[data-i]").forEach((el) => el.onclick = () => { ov.remove(); filtro[el.dataset.i].fn(); });
  };
  inp.oninput = () => { filtro = acoes.filter((a) => a.rot.toLowerCase().includes(inp.value.toLowerCase())); sel = 0; pintar(); };
  inp.onkeydown = (e) => {
    if (e.key === "ArrowDown") { sel = Math.min(sel + 1, Math.min(filtro.length, 9) - 1); pintar(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); pintar(); e.preventDefault(); }
    else if (e.key === "Enter" && filtro[sel]) { ov.remove(); filtro[sel].fn(); }
    else if (e.key === "Escape") ov.remove();
  };
  pintar(); inp.focus();
}
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k" && token) { e.preventDefault(); abrirPaleta(); }
});

async function telaLeitos() {
  const ROT = { livre: "Livre", ocupado: "Ocupado", limpeza: "Limpeza", manutencao: "Manutenção" };
  const campos = [
    { k: "numero", l: "Número / identificação", ph: "Ex.: 101-A" },
    { k: "setor", l: "Setor", t: "select", o: ["Enfermaria", "UTI", "Pronto-socorro", "Isolamento", "Pediatria", "Maternidade", "Observação"] },
    { k: "status", l: "Situação", t: "select", o: Object.entries(ROT) },
    { k: "paciente", l: "Paciente (se ocupado)" }
  ];
  const render = async () => {
    const lista = (await api("/colecao/leitos")).sort((a, b) => String(a.numero).localeCompare(String(b.numero), undefined, { numeric: true }));
    const c = (st) => lista.filter((l) => l.status === st).length;
    const taxa = lista.length ? Math.round((c("ocupado") / lista.length) * 100) : 0;
    $("conteudo").innerHTML = `
      <div class="fin">${mini(lista.length, "Leitos")}${mini(c("livre"), "Livres", "pos")}${mini(c("ocupado"), "Ocupados", "neg")}${mini(c("limpeza") + c("manutencao"), "Limpeza / manutenção")}${mini(taxa + "%", "Taxa de ocupação")}</div>
      <div class="card"><div class="barra" style="height:12px"><i class="${taxa > 85 ? "vermelho" : taxa > 60 ? "amarelo" : "verde"}" style="width:${taxa}%"></i></div></div>
      ${lista.length ? `<div class="leitos">${lista.map((l, i) => `
        <div class="leito ${esc(l.status)}" data-id="${l.id}" style="animation-delay:${Math.min(i, 20) * 25}ms">
          <span class="st">${ROT[l.status] || esc(l.status)}</span><b>${esc(l.numero)}</b><small>${esc(l.setor)}</small>
          <small>${l.paciente ? "👤 " + esc(l.paciente) : "&nbsp;"}</small>
          <button class="del" data-del="${l.id}" title="Excluir">🗑️</button></div>`).join("")}</div>`
        : `<div class="vazio">Nenhum leito cadastrado. Clique em “＋ Novo leito”.</div>`}`;
    $("conteudo").querySelectorAll(".leito").forEach((el) => el.onclick = (e) => {
      const l = lista.find((x) => String(x.id) === el.dataset.id);
      if (e.target.dataset.del) {
        return confirmar("Excluir leito", `Excluir o leito ${l.numero}?`, "Excluir").then(async (ok) => {
          if (ok && await tentar(() => api(`/colecao/leitos/${l.id}`, { method: "DELETE" }), "Leito excluído")) render();
        });
      }
      formulario(`Leito ${l.numero}`, campos, l, async (d) => {
        if (d.status !== "ocupado") d.paciente = "";
        const r = await tentar(() => api(`/colecao/leitos/${l.id}`, { method: "PUT", body: d }), "Leito atualizado");
        if (r) render();
        return !!r;
      });
    });
  };
  await render();
  $("acoesTopo").innerHTML = `<button class="btn" id="lNovo">＋ Novo leito</button><button class="btn sec" onclick="ir('leitos')">🔄</button>`;
  $("lNovo").onclick = () => formulario("Novo leito", campos, { status: "livre", setor: "Enfermaria" }, async (d) => {
    const r = await tentar(() => api("/colecao/leitos", { method: "POST", body: d }), "Leito criado");
    if (r) render();
    return !!r;
  });
}
